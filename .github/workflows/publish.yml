name: Publish

# Publishes to the Visual Studio Marketplace when a version tag is pushed.
# Trusted Publishing: the Marketplace trusts this workflow, so no token is stored.
# The one-time setup is in RELEASING.md.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)."; exit 1; }
      - run: npm run build
      - name: Check that the committed themes match the sources
        run: git diff --exit-code themes/ || { echo "::error::themes/ is out of date. Run npm run build and commit the result."; exit 1; }
      - run: npm test
      - run: npx @vscode/vsce@4.1.0 publish --oidc
