name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check that the committed themes match the sources
        run: git diff --exit-code themes/ || { echo "::error::themes/ is out of date. Run npm run build and commit the result."; exit 1; }
      - run: npm test
